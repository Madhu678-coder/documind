services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: documind-postgres
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - documind-network
    restart: unless-stopped

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: documind-neo4j
    environment:
      NEO4J_AUTH: neo4j/documind123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - documind-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: documind-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - documind-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://documind:documind@postgres:5432/documind
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AWS_REGION=us-east-1
      - AWS_BEDROCK_REGION=us-east-1
      - S3_BUCKET=${S3_BUCKET}
      - SECRET_KEY=${SECRET_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=documind123
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running migrations...' &&
        alembic upgrade head &&
        python seed_admin.py &&
        echo 'Starting backend...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8010 --workers 2
      "
    networks:
      - documind-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: documind-celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://documind:documind@postgres:5432/documind
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AWS_REGION=us-east-1
      - AWS_BEDROCK_REGION=us-east-1
      - S3_BUCKET=${S3_BUCKET}
      - SECRET_KEY=${SECRET_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=documind123
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A app.workers worker -Q default,eval_queue --concurrency=4 --loglevel=info
    networks:
      - documind-network
    restart: unless-stopped

  # Nginx (serves frontend + proxies API)
  nginx:
    image: nginx:alpine
    container_name: documind-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend-builder
    networks:
      - documind-network
    restart: unless-stopped

  # Frontend Builder (builds static files, then exits)
  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: documind-frontend-builder
    volumes:
      - frontend_build:/output
    command: sh -c "npm run build && cp -r dist/* /output/"
    networks:
      - documind-network

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  frontend_build:

networks:
  documind-network:
    driver: bridge
